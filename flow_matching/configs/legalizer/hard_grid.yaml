# Optional full physical-grid endpoint; legacy defaults are unchanged.
legalization:
  mode: hard_grid
  metadata: null
  scratch_root: ./work/runs/grid-legalization
  dreamplace_root: ./work/tools/dreamplace-4.1.0-torch221-cpu
